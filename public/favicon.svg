<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A tiny chalkboard in a wood frame with a chalk "G": the Gil-Bilt
       mark at bookmark size. Replace this file with any square SVG to
       change the tab and bookmark icon everywhere. -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#9a6a34"/>
  <rect x="9" y="9" width="46" height="46" rx="4" fill="#161616"/>
  <text x="32" y="48" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="40" fill="#e87722">G</text>
</svg>
